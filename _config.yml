# Site settings
title: "Edisson Giovanni Zúñiga López — Arquitecto de soluciones y DevSecOps"
description: "Arquitecto de soluciones y DevSecOps: 18 años construyendo plataformas que se pueden operar; desde 2024, con IA."
baseurl: "/Edisson-Giovanni-Z-Lopez"
url: "https://giovanemere.github.io"

# Author information
author:
  name: "Edisson Giovanni Zúñiga López"
  email: "giovanemere@gmail.com"
  bio: "Arquitecto de soluciones y DevSecOps."
  location: "Zipaquirá, Colombia"
  linkedin: "edisson-giovanni-zuñiga-lopez"
  github: "giovanemere"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO settings
lang: es
locale: es_CO

# Social media
social:
  name: Edisson Giovanni Zuñiga Lopez
  links:
    - https://github.com/giovanemere
    - https://www.linkedin.com/in/edisson-giovanni-zuñiga-lopez/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - README.md
  - ARCHITECTURE.md
  - QUICK-GUIDE.md
  - LICENSE
  - "*.sh"
  - FINAL-STRUCTURE.md
  - GITHUB-PAGES-STATUS.md
  - UPDATE-PROCESS.md

# Sass configuration
sass:
  sass_dir: assets/css
  style: compressed

# Compression
compress_html:
  clippings: all
  comments: all
  endings: all
